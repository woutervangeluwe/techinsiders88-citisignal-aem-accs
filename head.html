<script nonce="aem" src="/scripts/alloy.js"></script>

<script nonce="aem">
    alloy("configure", {
        defaultConsent: "in",
        edgeDomain: "edge.adobedc.net",
        edgeBasePath: "ee",
        datastreamId: "210ae45c-9834-45ec-9fe7-12f4959b5dba", // replace datastreamId
        orgId: "907075E95BF479EC0A495C73@AdobeOrg", // replace ims org Id
        debugEnabled: true,
        idMigrationEnabled: false,
        thirdPartyCookiesEnabled: false,
        prehidingStyle: ".personalization-container { opacity: 0 !important }",
    });

    window["alloy"]("sendEvent", {
        conversation: {
            fetchConversationalExperience: true
        }
    }).then(result => {
        console.log("Conversation experience fetched", result);
        const bootstrapConversationalExperience = (cnt) => {
            if(document.querySelector('#brand-concierge-mount'))
            {
                window["alloy"]("bootstrapConversationalExperience", {
                    selector: "#brand-concierge-mount",
                    src: "/scripts/brandconciergemain.js",
                    stylingConfigurations: window.styleConfiguration,
                    stickySession: true // create a sticky session cookie with expiration
                });
            }else{
                if(cnt<10){
                  setTimeout(()=>{bootstrapConversationalExperience(cnt+1)}, 100);
                }
            }
        };
        bootstrapConversationalExperience(0);
    });
</script>
